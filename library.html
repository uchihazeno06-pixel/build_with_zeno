<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Library — Build with Zeno</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body data-page="library">

<header class="site-header" id="site-header"></header>

<main>
  <div class="wrap page-head">
    <h1>My Library</h1>
    <p class="lede">Guides you've saved for later.</p>
  </div>

  <section>
    <div class="wrap">
      <div id="library-gate"></div>
      <div id="library-content" style="display:none;">
        <div id="library-list"></div>
        <div id="library-reader" style="margin-top:32px;"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
